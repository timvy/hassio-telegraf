name: Build and test

on: [push, pull_request]

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: hassio-telegraf

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read add-on version
        id: metadata
        shell: bash
        run: |
          version="$(sed -n 's/^version: *"\([^"]*\)".*/\1/p' telegraf/config.yaml)"
          if [[ -z "${version}" ]]; then
            echo "::error::Could not read the add-on version from telegraf/config.yaml"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    needs: init
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: ShellCheck
        if: matrix.arch == 'amd64'
        run: shellcheck telegraf/rootfs/etc/cont-init.d/telegraf.sh
      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: telegraf
          cosign: "false"
          image: ${{ matrix.image }}
          image-tags: ${{ needs.init.outputs.version }}
          version: ${{ needs.init.outputs.version }}
