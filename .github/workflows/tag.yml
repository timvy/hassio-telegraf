name: Publish add-on image

on:
  push:
    tags:
      - "*"

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: hassio-telegraf

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read and validate add-on version
        id: metadata
        shell: bash
        run: |
          version="$(sed -n 's/^version: *"\([^"]*\)".*/\1/p' telegraf/config.yaml)"
          if [[ -z "${version}" ]]; then
            echo "::error::Could not read the add-on version from telegraf/config.yaml"
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "${version}" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Git tag ${GITHUB_REF_NAME} must match add-on version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and publish architecture image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: telegraf
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          labels: |
            io.hass.name=Telegraf
            io.hass.description=An add-on to run Telegraf with Home Assistant.
            io.hass.type=addon
            io.hass.url=https://github.com/timvy/hassio-telegraf
          push: "true"
          version: ${{ needs.init.outputs.version }}

  manifest:
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-architecture manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
